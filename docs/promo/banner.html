<!doctype html>
<!--
  README banner, 1600 × 400. Open it from the repository: it uses the game's own fonts, sprite
  sheets and card art through relative paths. docs/images/banner.png is its screenshot.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Triple Triad banner</title>
    <style>
      @font-face {
        font-family: Cinzel;
        src: url('../../apps/web/src/app/fonts/cinzel-latin-variable.woff2') format('woff2');
        font-weight: 400 900;
      }
      @font-face {
        font-family: 'Exo 2';
        src: url('../../apps/web/src/app/fonts/exo-2-latin-variable.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #0a0f1f;
      }
      .banner {
        position: relative;
        width: 1600px;
        height: 400px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 720px 420px at 1190px 210px, #2f4479 0%, transparent 72%),
          radial-gradient(ellipse 760px 300px at 220px -40px, #22315a 0%, transparent 75%), #0a0f1f;
        font-family: 'Exo 2', sans-serif;
      }
      /* The menu window's double rule, from the game's header. */
      .banner::after {
        content: '';
        position: absolute;
        inset: 0;
        border-top: 3px solid #d6deef;
        border-bottom: 3px solid #d6deef;
        pointer-events: none;
      }
      .words {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
      }
      h1 {
        margin: 0;
        font-family: Cinzel, serif;
        font-size: 66px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.08em;
        white-space: nowrap;
        color: #f4ecd2;
        text-shadow:
          0 4px 0 #000,
          0 10px 28px rgb(0 0 0 / 0.7);
      }
      .tagline {
        margin: 18px 0 0;
        font-size: 23px;
        font-weight: 500;
        color: #d6deef;
      }
      .features {
        display: flex;
        gap: 10px;
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
      }
      .features li {
        padding: 6px 14px;
        border: 1px solid rgb(214 222 239 / 0.55);
        border-radius: 6px;
        background: rgb(0 0 0 / 0.3);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #f4ecd2;
      }
      .fan {
        position: absolute;
        left: 1190px;
        top: 200px;
      }
      .fan .card {
        position: absolute;
        width: 180px;
        margin: -126px 0 0 -90px;
        transform: translateX(var(--x)) translateY(var(--y)) rotate(var(--r));
      }
      .card {
        position: relative;
        aspect-ratio: 1024 / 1434;
        overflow: hidden;
        border-radius: 3% / 2.2%;
        box-shadow: 0 10px 26px rgb(0 0 0 / 0.65);
        container-type: inline-size;
      }
      .layer,
      .sprite,
      .name {
        position: absolute;
      }
      .layer {
        inset: 0;
        background-size: 100% 100%;
      }
      .sprite {
        background-repeat: no-repeat;
      }
      .name {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Cinzel, serif;
        font-weight: 700;
        white-space: nowrap;
        color: #fff;
        text-shadow: 0 0.3cqw 0.6cqw rgb(0 0 0 / 0.8);
      }
    </style>
  </head>
  <body>
    <div class="banner" id="banner">
      <div class="words">
        <h1>TRIPLE TRIAD</h1>
        <p class="tagline">The Final Fantasy VIII card game, played live in your browser.</p>
        <ul class="features">
          <li>Every FF8 rule</li>
          <li>Card maker</li>
          <li>Rankings</li>
          <li>Self-hosted</li>
        </ul>
      </div>
      <div class="fan" id="fan"></div>
    </div>
    <script>
      const PACK = '../../apps/web/public/packs/default/';
      const ART = '../../apps/web/assets/starter-art/';
      const DIGITS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'A'];
      const ELEMENTS = ['fire', 'ice', 'thunder', 'earth', 'poison', 'wind', 'water', 'holy'];
      const STAT_BOXES = [
        [135, 30, 285, 180],
        [240, 135, 390, 285],
        [135, 240, 285, 390],
        [30, 135, 180, 285],
      ];
      const STAR_BOXES = [342, 412, 482, 552, 622].map((x) => [x, 1334, x + 60, 1394]);

      /** The game's card layers (see CardView), positioned on its 1024 × 1434 layout. */
      function drawCard({ art, name, stars, stats, element, side }) {
        const card = document.createElement('div');
        card.className = 'card';
        const add = (className, style) => {
          const part = document.createElement('div');
          part.className = className;
          Object.assign(part.style, style);
          card.append(part);
          return part;
        };
        const place = ([x0, y0, x1, y1]) => ({
          left: `${(x0 / 1024) * 100}%`,
          top: `${(y0 / 1434) * 100}%`,
          width: `${((x1 - x0) / 1024) * 100}%`,
          height: `${((y1 - y0) / 1434) * 100}%`,
        });
        const sprite = (box, sheet, index, cells) =>
          add('sprite', {
            ...place(box),
            backgroundImage: `url(${PACK}${sheet}.png)`,
            backgroundSize: `${cells * 100}% 100%`,
            backgroundPosition: `${(index / (cells - 1)) * 100}% 0%`,
          });

        add('layer', { backgroundImage: `url(${PACK}bg-${side}.png)` });
        add('layer', { backgroundImage: `url(${ART}${art}.webp)` });
        add('layer', { backgroundImage: `url(${PACK}frame.png)` });
        stats.forEach((value, index) => {
          sprite(
            STAT_BOXES[index],
            'digits',
            DIGITS.indexOf(value === 10 ? 'A' : String(value)),
            10,
          );
        });
        if (element) sprite([844, 30, 994, 180], 'elements', ELEMENTS.indexOf(element), 8);
        STAR_BOXES.forEach((box, index) => sprite(box, 'stars', index < stars ? 0 : 1, 2));
        const label = add('name', {
          ...place([40, 1220, 984, 1324]),
          fontSize: `${(104 * 0.7 * 100) / 1024}cqw`,
        });
        label.textContent = name;
        return card;
      }

      // Drawn in order: the outer cards first, so the inner ones overlap them.
      const HAND = [
        {
          art: 'etna',
          name: 'Etna',
          stars: 3,
          stats: [7, 4, 6, 5],
          side: 'blue',
          x: -282,
          y: 26,
          r: -12,
        },
        {
          art: 'silence-suzuka',
          name: 'Silence Suzuka',
          stars: 4,
          stats: [9, 7, 3, 8],
          element: 'wind',
          side: 'red',
          x: 282,
          y: 26,
          r: 12,
        },
        {
          art: 'laharl',
          name: 'Laharl',
          stars: 4,
          stats: [6, 9, 4, 8],
          element: 'fire',
          side: 'red',
          x: -142,
          y: 6,
          r: -6,
        },
        {
          art: 'jotaro-kujo',
          name: 'Jotaro Kujo',
          stars: 4,
          stats: [9, 8, 4, 6],
          side: 'blue',
          x: 142,
          y: 6,
          r: 6,
        },
        { art: 'dio', name: 'DIO', stars: 5, stats: [10, 7, 3, 9], side: 'red', x: 0, y: -2, r: 0 },
      ];
      const fan = document.getElementById('fan');
      for (const { x, y, r, ...face } of HAND) {
        const card = drawCard(face);
        card.style.setProperty('--x', `${x}px`);
        card.style.setProperty('--y', `${y}px`);
        card.style.setProperty('--r', `${r}deg`);
        fan.append(card);
      }
    </script>
  </body>
</html>
