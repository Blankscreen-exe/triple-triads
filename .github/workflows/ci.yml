name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build and end-to-end
    runs-on: ubuntu-latest
    services:
      # S3-compatible storage, so the MinIO storage backend is tested against a real server.
      minio:
        image: bitnamilegacy/minio:2025.5.24
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          MINIO_TEST_ENDPOINT: localhost
          MINIO_TEST_PORT: 9000

      - name: Engine coverage
        run: pnpm --filter @triple-triad/engine test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @triple-triad/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: triple-triad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container becomes healthy and serves pages)
        run: |
          docker run -d --name app -p 127.0.0.1:3000:3000 triple-triad:ci
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ]; then
              curl -sf -o /dev/null http://127.0.0.1:3000/login && exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
